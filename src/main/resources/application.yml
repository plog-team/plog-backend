spring:
  application:
    name: plog-api
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/plog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: plog
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # MySQL 컨테이너 시작 전에도 앱이 종료되지 않도록 설정
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  
  #메일 인증
  mail:
    host: smtp.gmail.com
    port: 587
    username: plog12341234@gmail.com
    password: rdne zskd ejvx roxo
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    prefix: /WEB-INF/views/pages/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

server:
  port: 8080
  error:
    include-message: always

# 로컬 업로드 디렉터리 (절대/상대 모두 허용)
plog:
  upload:
    base-dir: ./uploads
  gemini:
    # application-local.yml에서 override
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
    endpoint: https://generativelanguage.googleapis.com/v1beta
    use-mock: true   # 기본 Mock 모드. application-local.yml에서 false로 변경하면 실제 Gemini 호출

aichat:
  gemini:
    api-key: ${AICHAT_GEMINI_API_KEY}
    model: gemini-2.5-flash
    endpoint: https://generativelanguage.googleapis.com/v1beta
    use-mock: false

logging:
  level:
    com.plog.api: DEBUG
    org.hibernate.SQL: INFO

api:
  service:
    key: ${API_SERVICE_KEY:}

jwt:
  secret: your-secret-key-must-be-at-least-32-characters-long
